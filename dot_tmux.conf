# =============================================
# Basic Settings
# =============================================
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm*:Tc"     # True color support
set -ag terminal-overrides ",*:RGB"

set -g escape-time 0                       # Faster ESC in Vim/Neovim
set -g history-limit 50000
set -g mouse on                             # Mouse support
set -g base-index 1                         # Windows start at 1
setw -g pane-base-index 1
set -g renumber-windows on

# =============================================
# Extended Keys (IMPORTANT for Shift+Enter)
# =============================================
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'   # Fix Shift+Enter, Ctrl+arrows, etc.

# =============================================
# Key Bindings
# =============================================

# Better pane splitting
bind '|' split-window -h -c "#{pane_current_path}"
bind '\' split-window -v -c "#{pane_current_path}"

unbind '"'
unbind %

# --- Smart Pane Switching (Vim Awareness) ---
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

# Logic: If in Vim, send the key. 
# If NOT in Vim, only move if there is a pane in that direction (prevents wrap).
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' { if -F '#{pane_at_left}'   '' 'select-pane -L' }
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' { if -F '#{pane_at_top}'    '' 'select-pane -U' }
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' { if -F '#{pane_at_right}'  '' 'select-pane -R' }

# Resize panels also on vim motions
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Toggle current panel to fullscreen, press it back to return it to the previous size
bind z resize-pane -Z

# Copy mode improvements
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# List of plugins
set -g @plugin 'tmux-plugins/tpm'                    # Plugin manager (required)
set -g @plugin 'tmux-plugins/tmux-sensible'          # Sensible defaults
set -g @plugin 'tmux-plugins/tmux-yank'              # Better copying to system clipboard
set -g @plugin 'catppuccin/tmux'                     # Beautiful modern theme (very popular in 2026)
set -g @plugin 'tmux-plugins/tmux-resurrect'         # Save & restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'         # Auto-save sessions

# Optional but very useful
# set -g @plugin 'christoomey/vim-tmux-navigator'    # Seamless Vim/Neovim + tmux navigation

# === New: Battery and CPU ===
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'

# Catppuccin settings
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# Better active pane visualization
set -g pane-border-lines double
set -g pane-border-indicators arrows
set -g pane-border-status top

run '~/.tmux/plugins/tpm/tpm'

